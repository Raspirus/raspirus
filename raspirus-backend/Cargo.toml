[package]
name = "raspirus-backend"
description = "Contains backend functionality for the raspirus tool like config handling and pdf handling"
version = "3.0.0"
edition = "2021"

[dependencies]
directories-next = "2.0.0"
log = "0.4.27"
serde = "1.0.219"
serde_json = "1.0.142"
num_cpus = "1.17.0"
thiserror = "2.0.14"
yara-x = "1.5.0"
chrono = "0.4.41"
zip = "4.3.0"
threadpool_rs = { git = "https://github.com/GamingGuy003/threadpool_rs.git", features = [
    "log",
] }
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
rust-i18n = "3.1.5"
