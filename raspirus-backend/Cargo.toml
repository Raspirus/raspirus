[package]
name = "raspirus-backend"
description = "Backend functionality for the raspirus tool; Scanning, config and pdfs"
version = "3.0.0"
edition = "2021"

[dependencies]
directories-next = "2.0.0"
log = "0.4.29"
serde = "1.0.228"
serde_json = "1.0.149"
num_cpus = "1.17.0"
thiserror = "2.0.18"
yara-x = "1.13.0"
chrono = "0.4.43"
zip = "8.1.0"
threadpool_rs = { git = "https://github.com/GamingGuy003/threadpool_rs.git", features = [
    "log",
] }
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
rust-i18n = "3.1.5"
